"""A user broker connection"""
type Account {
  createdAt: DateTime
  id: ID
  providerName: String
  status: BrokerConnStatus
  updatedAt: DateTime
}

union ApproveProposalResult = AuthError | NotFoundError | Proposal

type AuthError implements BaseError {
  message: String
}

"""Computed balance summary for the authenticated user"""
type Balance {
  cashBalance: Decimal
  dayPnl: Decimal
  dayPnlPercent: Decimal
  investedValue: Decimal
  totalValue: Decimal
}

interface BaseError {
  message: String
}

"""A user-configured AI trading bot"""
type Bot {
  activePosition: Position
  allocationPct: Decimal
  botBrainConfig: BotBrainConfig
  brain: BotBrainConfig
  combatPatience: CombatPatience
  createdAt: DateTime
  dailyMaxGain: Decimal
  dailyMaxLoss: Decimal
  exitStyle: String
  frame: BotFrame
  id: ID
  marketAwareness: MarketAwareness
  name: String
  owner: User
  proposals(status: ProposalStatus): [Proposal!]
  riskAttitude: RiskAttitude
  scanCapRemaining: Int
  scanCapUsed: Int
  sectors: [SectorFilter!]
  status: BotStatus
  stopStyle: String
  tradeTempo: TradeTempo
  updatedAt: DateTime
}

type BotBrainConfig {
  brainType: String
  keyPreview: String
  modelId: String
  provider: String
}

enum BotFrame {
  BERSERKER
  BRAWLER
  BRUISER
  GUARDIAN
  SCOUT
  SNIPER
}

type BotPerformanceResult {
  approvalRatePct: Decimal
  avgGainPerWin: Decimal
  avgHoldDurationHours: Decimal
  avgLossPerLoss: Decimal
  daysActive: Int
  largestSingleLoss: Decimal
  largestSingleWin: Decimal
  lossCount: Int
  pnlTimeSeries: [PnlDataPoint!]
  profitFactor: Decimal
  returnOnAllocatedCapitalPct: Decimal
  skipRatePct: Decimal
  totalProposalsApproved: Int
  totalProposalsGenerated: Int
  totalRealizedPnl: Decimal
  winCount: Int
  winRatePct: Decimal
}

union BotResult = Bot | NotFoundError | ValidationError

enum BotStatus {
  ACTIVE
  ARCHIVED
  DRAFT
  PAUSED
  STOOD_DOWN
}

type BotStoodDownError implements BaseError {
  message: String
}

type BrainCatalog {
  byokProviders: [BrainProviderOption!]
  defaultBrain: DefaultBrainInfo
}

input BrainConfigInput {
  apiKey: String
  brainType: BrainType!
  modelId: String!
  provider: String
}

type BrainModelOption {
  displayName: String
  modelId: String
}

type BrainProviderOption {
  displayName: String
  models: [BrainModelOption!]
  provider: String
}

enum BrainType {
  BYOK
  TACHYON_HOSTED
}

enum BrokerConnStatus {
  ACTIVE
  ERROR
  REVOKED
}

type CancelSubscriptionResult {
  success: Boolean
}

enum CombatPatience {
  CALCULATED
  IMPULSIVE
  PATIENT
  STRATEGIC
}

union ConnectBrokerResult = Account | ValidationError

input CreateBotInput {
  allocationPct: Decimal!
  avatarSeed: String!
  brain: BrainConfigInput!
  colorway: String!
  combatPatience: CombatPatience!
  dailyMaxGain: Decimal
  dailyMaxLossPct: Decimal!
  emotionalControls: EmotionalControlsInput!
  exitPersonality: ExitPersonalityInput!
  frameName: BotFrame!
  marketAwareness: MarketAwarenessInput!
  name: String!
  riskAttitude: RiskAttitude!
  rulesOfEngagement: RulesOfEngagementInput!
  sectors: [SectorFilter!]!
  stopLossStyle: StopLossStyleInput!
  tradeTempo: TradeTempo!
}

union CreateBotResult = Bot | ValidationError

scalar DateTime

scalar Decimal

type DefaultBrainInfo {
  brainType: String
  description: String
  displayName: String
  modelId: String
  provider: String
}

type DeleteBotResult {
  success: Boolean
}

input EmotionalControlsInput {
  cooldownAfterVolatility: Boolean!
  freezeAfterLosses: Int
  standDownAfterNoonIfLosing: Boolean!
}

input ExitPersonalityInput {
  name: ExitPersonalityName!
}

enum ExitPersonalityName {
  BALANCED
  PATIENT
  QUICK_FINISHER
}

type MarketAwareness {
  meanReversion: Float
  momentum: Float
  trendFollowing: Float
  volatility: Float
}

input MarketAwarenessInput {
  meanReversion: Float!
  momentum: Float!
  trendFollowing: Float!
  volatility: Float!
}

type Mutation {
  activateBot(id: ID!): BotResult
  approveProposal(id: ID!): ApproveProposalResult
  cancelSubscription: CancelSubscriptionResult

  """Mark the authenticated user's FTUE as complete. Idempotent."""
  completeOnboarding: Boolean
  connectBroker(brokerName: String!, credentials: String!): ConnectBrokerResult
  createBot(input: CreateBotInput!): CreateBotResult
  deleteBot(id: ID!): DeleteBotResult
  pauseBot(id: ID!): BotResult
  selectTier(stripePaymentMethodId: String, tier: SubscriptionTier!): SelectTierResult
  skipProposal(id: ID!): SkipProposalResult
  updateBotIdentity(id: ID!, input: UpdateBotIdentityInput!): UpdateBotIdentityResult
  validateBrainKey(apiKey: String!, provider: String!): ValidateBrainKeyResult
}

type NotFoundError implements BaseError {
  message: String
}

enum OrderEntryType {
  LIMIT
  MARKET
}

type PnlDataPoint {
  cumulativePnl: Decimal
  date: DateTime
}

"""An open or closed trading position held by a bot"""
type Position {
  avgEntryPrice: Decimal
  bot: Bot
  closedAt: DateTime
  id: ID
  minHoldUntil: DateTime
  openedAt: DateTime
  qty: Decimal
  status: PositionStatus
  symbol: String
}

enum PositionStatus {
  CLOSED
  OPEN
}

"""A trade proposal generated by a bot, pending user approval"""
type Proposal {
  bot: Bot
  confidence: Decimal
  createdAt: DateTime
  entryType: OrderEntryType
  expiresAt: DateTime
  id: ID
  limitPrice: Decimal
  minHoldUntil: DateTime
  qty: Decimal
  rationaleText: String
  side: ProposalSide
  status: ProposalStatus
  stopPrice: Decimal
  symbol: String
  targetPrice: Decimal
}

enum ProposalSide {
  BUY
  SELL
}

enum ProposalStatus {
  APPROVED
  CANCELLED
  EXPIRED
  PENDING
  SKIPPED
}

type Query {
  account: Account
  balance: Balance
  bot(id: ID!): Bot
  botPerformance(id: ID!): BotPerformanceResult
  bots: [Bot!]
  brainProviders: BrainCatalog
  me: User
  positions: [Position!]
  proposals(status: ProposalStatus): [Proposal!]
}

enum RiskAttitude {
  AGGRESSIVE
  BALANCED
  CAUTIOUS
}

input RulesOfEngagementInput {
  noSameDayExitUnlessStopLoss: Boolean!
  overnightHoldAllowed: Boolean!
}

enum SectorFilter {
  ANY
  ENERGY
  ETFS_ONLY
  FINANCIALS
  HEALTHCARE
  LIQUID_LARGE_CAPS
  MEGA_CAPS_ONLY
  TECH
}

type SelectTierResult {
  subscriptionStatus: SubscriptionStatus
  subscriptionTier: SubscriptionTier
  trialExpiresAt: DateTime
}

union SkipProposalResult = AuthError | NotFoundError | Proposal

input StopLossStyleInput {
  name: StopStyleName!
}

enum StopStyleName {
  ADAPTIVE
  FLEXIBLE
  HARD
}

type Subscription {
  orderUpdated(botId: ID!): Position
  proposalCreated(botId: ID!): Proposal
}

enum SubscriptionStatus {
  active
  cancelled
  past_due
  suspended
  trialing
}

enum SubscriptionTier {
  BYOK
  FREE_TRIAL
  TACHYON_HOSTED
}

enum TradeTempo {
  ACTIVE
  OPPORTUNISTIC
  RELENTLESS
}

input UpdateBotIdentityInput {
  avatarSeed: String!
  name: String!
}

type UpdateBotIdentityResult {
  bot: Bot
}

"""An authenticated Tachyon user"""
type User {
  auth0Id: String
  createdAt: DateTime
  currentPeriodEnd: DateTime
  email: String
  id: ID

  """Whether the user has completed the FTUE onboarding flow."""
  onboardingCompleted: Boolean!
  subscriptionStatus: SubscriptionStatus
  subscriptionTier: SubscriptionTier
  trialExpiresAt: DateTime
}

type ValidateBrainKeyResult {
  error: String
  valid: Boolean
}

type ValidationError implements BaseError {
  code: String
  field: String
  message: String
}