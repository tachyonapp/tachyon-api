"""A user broker connection"""
type Account {
  createdAt: DateTime
  id: ID
  providerName: String
  status: BrokerConnStatus
  updatedAt: DateTime
}

union ApproveProposalResult = AuthError | NotFoundError | Proposal

type AuthError implements BaseError {
  message: String
}

"""Computed balance summary for the authenticated user"""
type Balance {
  cashBalance: Decimal
  dayPnl: Decimal
  dayPnlPercent: Decimal
  investedValue: Decimal
  totalValue: Decimal
}

interface BaseError {
  message: String
}

"""A user-configured AI trading bot"""
type Bot {
  activePosition: Position
  agentBackground: String
  avatarSeed: String
  bearRegimeBehavior: RegimeBehavior
  botBrainConfig: BotBrainConfig
  brain: BotBrainConfig
  bullRegimeBehavior: RegimeBehavior

  """Fixed dollar amount the agent may deploy in a single position."""
  capitalAllocatedUsd: Float!
  combatPatience: CombatPatience
  confidenceThreshold: ConfidenceThreshold
  createdAt: DateTime
  customWatchlist: [String!]
  dailyMaxGain: Decimal
  dailyMaxLoss: Decimal
  dayAvoidance: [DayOfWeek!]
  dividendPreference: DividendPreference
  earningsBehavior: EarningsBehavior
  exclusionList: [String!]
  exitStyle: String
  frame: BotFrame
  id: ID
  lossReaction: String
  marketAwareness: MarketAwareness
  maxDrawdownProtectionPct: Float
  minRrRatio: Float
  name: String
  owner: User
  positionSizingMethod: PositionSizingMethod
  proposalCommunicationStyle: ProposalCommunicationStyle
  proposals(status: ProposalStatus): [Proposal!]
  recoveryMode: RecoveryMode

  """
  Date through which recovery mode constraints are active. Null if not in recovery.
  """
  recoveryModeActiveUntil: DateTime

  """Recovery mode variant being enforced. Null if not in recovery."""
  recoveryModeApplied: String
  riskAttitude: RiskAttitude
  scanCapRemaining: Int
  scanCapUsed: Int
  sectors: [SectorFilter!]
  sessionPreference: SessionPreference
  shortInterestSignal: ShortInterestSignal
  signalWeights: SignalWeightsOutput
  status: BotStatus
  stopStyle: String
  subSectors: [String!]
  tradeTempo: TradeTempo
  updatedAt: DateTime
  volatilityEnvPreference: VolatilityEnvPreference
  winReaction: String
}

type BotBrainConfig {
  anthropicModelVariant: String
  brainType: String
  geminiModelVariant: String
  groqModelVariant: String
  keyPreview: String
  modelId: String
  openaiModelVariant: String
  provider: String
}

enum BotFrame {
  BERSERKER
  BRAWLER
  BRUISER
  GUARDIAN
  SCOUT
  SNIPER
}

type BotMutationResult {
  advisories: [MutationAdvisory!]
  bot: Bot
}

type BotPerformanceResult {
  approvalRatePct: Decimal
  avgGainPerWin: Decimal
  avgHoldDurationHours: Decimal
  avgLossPerLoss: Decimal
  daysActive: Int
  largestSingleLoss: Decimal
  largestSingleWin: Decimal
  lossCount: Int
  pnlTimeSeries: [PnlDataPoint!]
  profitFactor: Decimal
  returnOnAllocatedCapitalPct: Decimal
  skipRatePct: Decimal
  totalProposalsApproved: Int
  totalProposalsGenerated: Int
  totalRealizedPnl: Decimal
  winCount: Int
  winRatePct: Decimal
}

union BotResult = Bot | NotFoundError | ValidationError

enum BotStatus {
  ACTIVE
  ARCHIVED
  DRAFT
  PAUSED
  STOOD_DOWN
}

type BotStoodDownError implements BaseError {
  message: String
}

type BrainCatalog {
  byokProviders: [BrainProviderOption!]
  defaultBrain: DefaultBrainInfo
}

input BrainConfigInput {
  anthropicModelVariant: String
  apiKey: String
  brainType: BrainType!
  geminiModelVariant: String
  groqModelVariant: String
  modelId: String!
  openaiModelVariant: String
  provider: String
}

type BrainModelOption {
  displayName: String
  modelId: String
}

type BrainProviderOption {
  displayName: String
  models: [BrainModelOption!]
  provider: String
}

enum BrainType {
  BYOK
  TACHYON_HOSTED
}

enum BrokerConnStatus {
  ACTIVE
  ERROR
  REVOKED
}

type CancelSubscriptionResult {
  success: Boolean
}

enum CombatPatience {
  CALCULATED
  IMPULSIVE
  PATIENT
  STRATEGIC
}

enum ConfidenceThreshold {
  HIGH
  LOW
  MEDIUM
  VERY_HIGH
}

union ConnectBrokerResult = Account | ValidationError

input CreateBotInput {
  agentBackground: String
  avatarSeed: String!
  bearRegimeBehavior: RegimeBehavior
  brain: BrainConfigInput!
  bullRegimeBehavior: RegimeBehavior
  capitalAllocatedUsd: Float!
  colorway: String!
  combatPatience: CombatPatience!
  confidenceThreshold: ConfidenceThreshold
  customWatchlist: [String!]
  dailyMaxGain: Decimal
  dailyMaxLossPct: Decimal!
  dayAvoidance: [DayOfWeek!]
  dividendPreference: DividendPreference
  earningsBehavior: EarningsBehavior
  emotionalControls: EmotionalControlsInput!
  exclusionList: [String!]
  exitPersonality: ExitPersonalityInput!
  frameName: BotFrame!
  lossReaction: String
  marketAwareness: MarketAwarenessInput!
  maxDrawdownProtectionPct: Float
  minRrRatio: Float
  name: String!
  positionSizingMethod: PositionSizingMethod
  proposalCommunicationStyle: ProposalCommunicationStyle
  recoveryMode: RecoveryMode
  riskAttitude: RiskAttitude!
  rulesOfEngagement: RulesOfEngagementInput!
  sectors: [SectorFilter!]!
  sessionPreference: SessionPreference
  shortInterestSignal: ShortInterestSignal
  signalWeights: SignalWeightsInput
  stopLossStyle: StopLossStyleInput!
  subSectors: [String!]
  tradeTempo: TradeTempo!
  volatilityEnvPreference: VolatilityEnvPreference
  winReaction: String
}

union CreateBotResult = Bot | ValidationError

scalar DateTime

enum DayOfWeek {
  FRIDAY
  MONDAY
  THURSDAY
  TUESDAY
  WEDNESDAY
}

scalar Decimal

type DefaultBrainInfo {
  brainType: String
  description: String
  displayName: String
  modelId: String
  provider: String
}

type DeleteBotResult {
  success: Boolean
}

enum DividendPreference {
  EXCLUDE_DIVIDEND
  NO_PREFERENCE
  PREFER_DIVIDEND
}

enum EarningsBehavior {
  MORE_AGGRESSIVE
  NEUTRAL
  STAND_DOWN
}

input EmotionalControlsInput {
  cooldownAfterVolatility: Boolean!
  freezeAfterLosses: Int
  standDownAfterNoonIfLosing: Boolean!
}

input ExitPersonalityInput {
  name: ExitPersonalityName!
}

enum ExitPersonalityName {
  BALANCED
  PATIENT
  QUICK_FINISHER
}

type MarketAwareness {
  meanReversion: Float
  momentum: Float
  trendFollowing: Float
  volatility: Float
}

input MarketAwarenessInput {
  meanReversion: Float!
  momentum: Float!
  trendFollowing: Float!
  volatility: Float!
}

type Mutation {
  activateBot(id: ID!): BotResult
  approveProposal(id: ID!): ApproveProposalResult
  cancelSubscription: CancelSubscriptionResult

  """Mark the authenticated user's FTUE as complete. Idempotent."""
  completeOnboarding: Boolean
  connectBroker(brokerName: String!, credentials: String!): ConnectBrokerResult
  createBot(input: CreateBotInput!): CreateBotResult
  deleteBot(id: ID!): DeleteBotResult
  pauseBot(id: ID!): BotResult
  selectTier(stripePaymentMethodId: String, tier: SubscriptionTier!): SelectTierResult
  skipProposal(id: ID!): SkipProposalResult
  updateAgentIdentity(id: ID!, input: UpdateAgentIdentityInput!): UpdateAgentIdentityResult
  updateAgentRiskSettings(id: ID!, input: UpdateAgentRiskSettingsInput!): UpdateAgentRiskSettingsResult
  updateBotBrain(id: ID!, input: UpdateBotBrainInput!): UpdateBotBrainResult
  validateBrainKey(apiKey: String!, provider: String!): ValidateBrainKeyResult
}

type MutationAdvisory {
  code: String
  field: String
  message: String
}

type NotFoundError implements BaseError {
  message: String
}

enum OrderEntryType {
  LIMIT
  MARKET
}

type PnlDataPoint {
  cumulativePnl: Decimal
  date: DateTime
}

"""An open or closed trading position held by a bot"""
type Position {
  avgEntryPrice: Decimal
  bot: Bot
  closedAt: DateTime
  id: ID
  minHoldUntil: DateTime
  openedAt: DateTime
  qty: Decimal
  status: PositionStatus
  symbol: String
}

enum PositionSizingMethod {
  CONVICTION_SCALED
  FIXED_PCT
  VOLATILITY_ADJUSTED
}

enum PositionStatus {
  CLOSED
  OPEN
}

"""A trade proposal generated by a bot, pending user approval"""
type Proposal {
  bot: Bot
  confidence: Decimal
  createdAt: DateTime
  entryType: OrderEntryType
  expiresAt: DateTime
  id: ID
  limitPrice: Decimal
  minHoldUntil: DateTime
  qty: Decimal
  rationaleText: String
  rejectionReason: String
  side: ProposalSide
  status: ProposalStatus
  stopPrice: Decimal
  symbol: String
  targetPrice: Decimal
}

enum ProposalCommunicationStyle {
  AGGRESSIVE_CONFIDENT
  CAUTIOUS_MEASURED
  DETAILED
  TERSE
}

enum ProposalSide {
  BUY
  SELL
}

enum ProposalStatus {
  APPROVED
  CANCELLED
  EXPIRED
  PENDING
  SKIPPED
}

type Query {
  account: Account
  balance: Balance
  bot(id: ID!): Bot
  botPerformance(id: ID!): BotPerformanceResult
  bots: [Bot!]
  brainProviders: BrainCatalog
  me: User
  parentSectors: [SectorDefinition!]!
  positions: [Position!]
  proposals(status: ProposalStatus): [Proposal!]
}

enum RecoveryMode {
  MORE_CONSERVATIVE_2D
  NORMAL
  STAND_DOWN_1W
}

enum RegimeBehavior {
  NO_CHANGE
  PAUSE
  SIZE_DOWN
  SIZE_UP
}

enum RiskAttitude {
  AGGRESSIVE
  BALANCED
  CAUTIOUS
}

input RulesOfEngagementInput {
  noSameDayExitUnlessStopLoss: Boolean!
  overnightHoldAllowed: Boolean!
}

type SectorDefinition {
  parentSector: String
  subSectors: [String!]
}

enum SectorFilter {
  ANY
  ENERGY
  ETFS_ONLY
  FINANCIALS
  HEALTHCARE
  LIQUID_LARGE_CAPS
  MEGA_CAPS_ONLY
  TECH
}

type SelectTierResult {
  subscriptionStatus: SubscriptionStatus
  subscriptionTier: SubscriptionTier
  trialExpiresAt: DateTime
}

enum SessionPreference {
  AFTERNOON_HUNTER
  AVOID_FIRST_30
  FULL_SESSION
  MORNING_HUNTER
}

enum ShortInterestSignal {
  AVOID_HIGH_SHORT_INTEREST
  IGNORE
  TARGET_SHORT_SQUEEZE
}

input SignalWeightsInput {
  fundamentals: Int!
  news: Int!
  technicals: Int!
}

type SignalWeightsOutput {
  fundamentals: Int
  news: Int
  technicals: Int
}

union SkipProposalResult = AuthError | NotFoundError | Proposal

input StopLossStyleInput {
  name: StopStyleName!
}

enum StopStyleName {
  ADAPTIVE
  FLEXIBLE
  HARD
}

type Subscription {
  orderUpdated(botId: ID!): Position
  proposalCreated(botId: ID!): Proposal
}

enum SubscriptionStatus {
  active
  cancelled
  past_due
  suspended
  trialing
}

enum SubscriptionTier {
  BYOK
  FREE_TRIAL
  TACHYON_HOSTED
}

enum TradeTempo {
  ACTIVE
  OPPORTUNISTIC
  RELENTLESS
}

input UpdateAgentIdentityInput {
  avatarSeed: String!
  backstory: String
  communicationStyle: ProposalCommunicationStyle
  lossReaction: String
  name: String!
  winReaction: String
}

type UpdateAgentIdentityResult {
  bot: Bot
}

input UpdateAgentRiskSettingsInput {
  minRrRatio: Float!
  positionSizingMethod: PositionSizingMethod!
  recoveryMode: RecoveryMode!
}

type UpdateAgentRiskSettingsResult {
  bot: Bot
}

input UpdateBotBrainInput {
  modelVariant: String!
}

type UpdateBotBrainResult {
  bot: Bot
}

"""An authenticated Tachyon user"""
type User {
  auth0Id: String
  createdAt: DateTime
  currentPeriodEnd: DateTime
  email: String
  id: ID

  """Whether the user has completed the FTUE onboarding flow."""
  onboardingCompleted: Boolean!
  subscriptionStatus: SubscriptionStatus
  subscriptionTier: SubscriptionTier
  trialExpiresAt: DateTime
}

type ValidateBrainKeyResult {
  error: String
  valid: Boolean
}

type ValidationError implements BaseError {
  code: String
  field: String
  message: String
}

enum VolatilityEnvPreference {
  NO_PREFERENCE
  PREFERS_HIGH_VIX
  PREFERS_LOW_VIX
}